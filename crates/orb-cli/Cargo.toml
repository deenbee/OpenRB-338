[package]
name = "orb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "orb_cli"
path = "src/lib.rs"

[[bin]]
name = "orb"
path = "src/main.rs"

[features]
# Forward the native PipeWire/PulseAudio audio hosts of `orb-player` (see its Cargo.toml). On
# by default; `--no-default-features` builds the ALSA-only output the snap wants.
default = ["native-audio"]
native-audio = ["orb-player/native-audio"]

[dependencies]
rbs = { path = "../rbs" }
orb-engine = { path = "../orb-engine" }
rbm = { path = "../rbm" }
# orb play.
orb-player = { path = "../orb-player", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
flacenc = "0.5.1"
vorbis_rs = "0.5.6"
# orb compare: the FLAC references, the manifest and the WAVs' sha256.
claxon = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.10"
cab = "=0.6.0"
ctrlc = "3.5.2"

[dev-dependencies]
# The gated tests' external inputs (task-121); a dev-dependency cycle (it uses orb_cli::cd).
orb-testkit = { path = "../orb-testkit" }
tempfile = "3.27.0"
